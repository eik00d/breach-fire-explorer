# Deploys the static build (dist/client) to GitHub Pages.
# One-time setup in the GitHub repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static site
        env:
          GH_PAGES: "1"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bunx vite build --base="$BASE_PATH"

      - name: Prepare static output
        run: |
          mv dist/client/_shell.html dist/client/index.html
          touch dist/client/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./"><title>Redirecting</title>' > dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
